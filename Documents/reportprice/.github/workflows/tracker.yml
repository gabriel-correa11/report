name: Price Tracker Cron Job

on:
  schedule:
    - cron: '0 * * * *' # Runs every 60 minutes
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Documents/reportprice

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Tracker Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push prices.db if updated
        run: |
          if [ -f prices.db ]; then
            git add prices.db
            git diff --cached --quiet || git commit -m "auto: update price_history database"
            git push origin main
          else
            echo "prices.db not found, skipping commit."
          fi
